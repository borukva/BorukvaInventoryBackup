plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.nucleoid.xyz' }
	maven { url = "https://repo.akka.io/maven/" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://mvnrepository.com/artifact/org.scala-lang/scala3-library" }
	maven { url = "https://api.modrinth.com/maven" }
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// lombok
	compileOnly("org.projectlombok:lombok:1.18.42")
	annotationProcessor("org.projectlombok:lombok:1.18.42")

	// sqlite and orm
	implementation include('com.j256.ormlite:ormlite-jdbc:6.1')
	implementation include('com.j256.ormlite:ormlite-core:6.1')
	include(implementation 'com.h2database:h2:2.3.232')
	include(implementation("com.mysql:mysql-connector-j:8.0.33"))

	// Pekko
	include (implementation "org.apache.pekko:pekko-actor-typed_3:${pekko_version}")
	include (implementation "org.apache.pekko:pekko-actor_3:${pekko_version}")
	include (implementation "org.apache.pekko:pekko-slf4j_3:${pekko_version}")
	include (implementation 'com.typesafe:config:1.4.3')
	include (implementation 'org.scala-lang:scala3-library_3:3.3.3')
	include (implementation "org.scala-lang.modules:scala-java8-compat_2.13:1.0.2")

	implementation include("eu.pb4:sgui:2.1.0+26.2")

	// Optional: trinket slots are backed up only when Trinkets is installed
	compileOnly "eu.pb4:trinkets:${project.trinkets_version}"
	include(implementation('me.lucko:fabric-permissions-api:0.7.0'))

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	runtimeOnly "maven.modrinth:scalable-cats-force:5.0.0-fabric"
}

test {
	useJUnitPlatform()
	dependsOn "jar"
	def testRunDirectory = layout.buildDirectory.dir("test-run").get().asFile
	doFirst {
		systemProperty "borukva.test.modJar", tasks.named("jar").get().archiveFile.get().asFile.absolutePath
		testRunDirectory.mkdirs()
	}
	workingDir testRunDirectory
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
